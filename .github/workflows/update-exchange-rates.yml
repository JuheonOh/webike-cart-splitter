name: update-exchange-rates

on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Update exchange rates
        run: node scripts/update-exchange-rates.js

      - name: Commit exchange rate data
        run: |
          if git diff --quiet -- data/exchange-rates.json; then
            echo "No exchange rate changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/exchange-rates.json
          git commit -m "chore: 수입환율 데이터 갱신"
          git push
