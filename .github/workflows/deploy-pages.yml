name: deploy-pages

on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify scripts
        run: |
          node tests/cart_group_calculator.test.js
          node tests/update_exchange_rates.test.js

      - name: Update exchange rates
        if: github.event_name != 'push'
        run: node scripts/update-exchange-rates.js

      - name: Commit exchange rate data
        if: github.event_name != 'push'
        run: |
          if git diff --quiet -- data/exchange-rates.json; then
            echo "No exchange rate changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/exchange-rates.json
          git commit -m "chore: 수입환율 데이터 갱신"
          git push

      - name: Prepare Pages artifact
        run: |
          rm -rf dist
          mkdir -p dist/data
          cp index.html dist/index.html
          cp cart_group_calculator.html dist/cart_group_calculator.html
          cp .nojekyll dist/.nojekyll
          cp data/exchange-rates.json dist/data/exchange-rates.json

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
