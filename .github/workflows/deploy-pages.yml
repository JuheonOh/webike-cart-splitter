name: deploy-pages

on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Normal code pushes only need to read the repository. They never write back
  # to it, so a compromised build cannot use the Actions token to push commits.
  deploy-push:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify unit tests
        run: npm test

      - name: Build Vite artifact
        run: npm run build

      - name: Audit build artifact
        run: npm run test:artifact
        env:
          EXCHANGE_RATE_MAX_STALE_DAYS: "14"
          EXCHANGE_RATE_MAX_FUTURE_DAYS: "1"

      - name: Install Playwright browsers
        run: npm run test:e2e:install

      - name: Verify built artifact E2E
        run: npm run test:e2e

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # Scheduled/manual runs refresh the exchange-rate file, verify and build it,
  # then commit the validated data before deploying the same artifact.
  # This is the only job that needs repository write access.
  update-exchange-rates-and-deploy:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Update exchange rates
        run: node scripts/update-exchange-rates.js
        env:
          EXCHANGE_RATE_MAX_ATTEMPTS: "3"
          EXCHANGE_RATE_MAX_STALE_DAYS: "14"
          EXCHANGE_RATE_MAX_FUTURE_DAYS: "1"

      - name: Verify unit tests
        run: npm test

      - name: Build Vite artifact
        run: npm run build

      - name: Audit build artifact
        run: npm run test:artifact
        env:
          EXCHANGE_RATE_MAX_STALE_DAYS: "14"
          EXCHANGE_RATE_MAX_FUTURE_DAYS: "1"

      - name: Install Playwright browsers
        run: npm run test:e2e:install

      - name: Verify built artifact E2E
        run: npm run test:e2e

      - name: Commit exchange rate data
        run: |
          if git diff --quiet -- data/exchange-rates.json; then
            echo "No exchange rate changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/exchange-rates.json
          git commit -m "chore: 수입환율 데이터 갱신 [skip ci]"
          git push

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
