<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>관세청 과세환율 주문 그룹 계산기</title>
  <link rel="stylesheet" href="assets/css/cart-group-calculator.css">
</head>
<body>
<div id="public-nav-root" data-page="calculator"></div>

<main>
  <h1>관세청 과세환율 주문 그룹 계산기</h1>
  <div id="production-feature-root" data-page="calculator"></div>

  <div class="layout">
    <section class="panel">
      <h2>상품 입력</h2>
      <div class="mode-control" aria-label="입력 방식">
        <label class="mode-option">
          <input type="radio" name="inputMode" value="html" checked>
          <span>장바구니 HTML</span>
        </label>
        <label class="mode-option">
          <input type="radio" name="inputMode" value="manual">
          <span>직접 입력</span>
        </label>
      </div>

      <div id="htmlInputPanel" class="input-panel">
        <label for="cartHtml">HTML 붙여넣기</label>
        <textarea id="cartHtml" spellcheck="false" placeholder="Webike 장바구니의 table-cart HTML을 여기에 붙여넣으세요."></textarea>
      </div>

      <div id="manualInputPanel" class="input-panel" hidden>
        <div class="bulk-paste">
          <label for="bulkPasteInput">CSV/TSV 붙여넣기</label>
          <textarea id="bulkPasteInput" spellcheck="false" placeholder="상품번호&#9;수량&#9;상품명&#9;단가JPY&#9;상품URL"></textarea>
          <div class="button-row">
            <button type="button" class="secondary compact" id="applyBulkPasteButton">붙여넣기 반영</button>
            <button type="button" class="secondary compact" id="clearBulkPasteButton">비우기</button>
          </div>
        </div>
        <div class="table-wrap manual-table">
          <table id="manualTable">
            <thead>
              <tr>
                <th>상품번호</th>
                <th>상품명</th>
                <th class="num">수량</th>
                <th class="num">단가(JPY)</th>
                <th>삭제</th>
              </tr>
            </thead>
            <tbody id="manualRows"></tbody>
          </table>
        </div>
        <div class="button-row">
          <button type="button" class="secondary compact" id="addManualRowButton">행 추가</button>
        </div>
      </div>

      <div class="button-row">
        <button type="button" id="analyzeButton">분석하기</button>
        <button type="button" id="exportXlsxButton" disabled>XLSX 내보내기</button>
        <button type="button" id="exportCsvZipButton" disabled>그룹 CSV 내보내기</button>
        <button type="button" class="secondary" id="clearButton">초기화</button>
      </div>
      <div id="errorBox" class="error-box" role="alert"></div>
    </section>

    <aside class="panel">
      <h2>계산 기준</h2>
      <div class="controls">
        <div>
          <label for="limitUsd">면세 기준(USD)</label>
          <input id="limitUsd" type="number" min="1" step="0.01" value="150">
        </div>
        <div>
          <label for="usdKrw">USD 수입환율(원)</label>
          <input id="usdKrw" type="number" min="1" step="0.01" value="1465.73">
        </div>
        <div>
          <label for="jpyKrw">JPY 수입환율(원)</label>
          <input id="jpyKrw" type="number" min="0.0001" step="0.001" value="9.3399">
        </div>
        <div>
          <label for="maxGroups">최대 주문 수</label>
          <input id="maxGroups" type="number" min="1" max="20" step="1" value="8">
        </div>
        <label class="wide check-row">
          <input id="splitQuantity" type="checkbox" checked>
          <span>같은 상품 수량 분할 허용</span>
        </label>
      </div>
      <p class="note">
        관세청 고시 수입환율은 주 단위로 바뀝니다. 주문 또는 입항 예상 주차의 값을 입력하세요.
      </p>
      <p class="source" id="exchangeRateSource" aria-live="polite">
        자동환율을 확인하는 중입니다. 불러오지 못하면 현재 입력값을 사용합니다.
        <a href="https://www.forwarder.kr/curr/index.php?curr=ex_rate" target="_blank" rel="noopener noreferrer">관세청 고시환율 조회</a>
      </p>
    </aside>
  </div>

  <section id="resultArea" aria-live="polite">
    <div class="empty">분석 결과가 여기에 표시됩니다.</div>
  </section>
</main>

<script type="module" src="/src/entries/public-shell.js"></script>
<script src="assets/js/delimited-core.js"></script>
<script src="assets/js/calculator-grouping.js"></script>
<script src="assets/js/exchange-rate-policy.js"></script>
<script src="assets/js/calculator-core.js"></script>
<script src="assets/js/cart-group-calculator.js"></script>
</body>
</html>
