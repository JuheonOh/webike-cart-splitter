<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>관세청 과세환율 주문 그룹 계산기</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f4f6f8;
      --panel: #fff;
      --text: #202631;
      --muted: #657286;
      --line: #d9e0e8;
      --head: #edf2f7;
      --accent: #1264a3;
      --success: #087443;
      --danger: #b42318;
      --warn: #b54708;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, "Noto Sans KR", sans-serif;
      line-height: 1.5;
    }
    main {
      max-width: 1220px;
      margin: 0 auto;
      padding: 24px 16px 36px;
    }
    h1 {
      margin: 0 0 18px;
      font-size: 26px;
      letter-spacing: 0;
    }
    h2 {
      margin: 0 0 12px;
      font-size: 18px;
      letter-spacing: 0;
    }
    label {
      display: block;
      margin: 0 0 6px;
      font-size: 13px;
      font-weight: 700;
      color: #344054;
    }
    input, textarea, button {
      font: inherit;
    }
    input, textarea {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fff;
      color: var(--text);
    }
    input {
      height: 40px;
      padding: 0 10px;
    }
    textarea {
      min-height: 280px;
      padding: 12px;
      resize: vertical;
      font-family: Consolas, "Courier New", monospace;
      font-size: 13px;
    }
    button {
      border: 0;
      border-radius: 6px;
      padding: 10px 14px;
      background: var(--accent);
      color: #fff;
      font-weight: 700;
      cursor: pointer;
    }
    button.secondary {
      background: #475467;
    }
    button:focus-visible,
    input:focus-visible,
    textarea:focus-visible {
      outline: 3px solid rgba(18, 100, 163, .22);
      outline-offset: 1px;
    }
    a { color: var(--accent); }
    .layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 340px;
      gap: 16px;
      align-items: start;
    }
    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 16px;
    }
    .controls {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }
    .wide { grid-column: 1 / -1; }
    .button-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 12px;
    }
    .check-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 10px;
      color: var(--muted);
      font-size: 13px;
    }
    .check-row input {
      width: 18px;
      height: 18px;
    }
    .note {
      margin: 12px 0 0;
      color: var(--muted);
      font-size: 13px;
    }
    .summary {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
      margin: 16px 0;
    }
    .metric {
      background: #fff;
      border: 1px solid var(--line);
      border-left: 4px solid var(--accent);
      border-radius: 8px;
      padding: 12px;
      min-height: 92px;
    }
    .metric span {
      display: block;
      color: var(--muted);
      font-size: 13px;
    }
    .metric b {
      display: block;
      margin-top: 4px;
      font-size: 20px;
      color: var(--text);
    }
    .metric small {
      display: block;
      margin-top: 3px;
      color: var(--muted);
    }
    .ok { color: var(--success); font-weight: 700; }
    .bad { color: var(--danger); font-weight: 700; }
    .warn { color: var(--warn); font-weight: 700; }
    .group-grid {
      display: grid;
      gap: 14px;
    }
    .group-card {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: hidden;
    }
    .group-head {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 8px;
      padding: 12px 14px;
      background: var(--head);
      border-bottom: 1px solid var(--line);
    }
    .group-head b {
      font-size: 17px;
    }
    .badge {
      display: inline-block;
      border-radius: 999px;
      padding: 2px 8px;
      background: #e7f6ed;
      color: var(--success);
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
    }
    .table-wrap {
      overflow-x: auto;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 760px;
    }
    th, td {
      padding: 9px 10px;
      border-bottom: 1px solid var(--line);
      text-align: left;
      vertical-align: top;
      font-size: 14px;
    }
    th {
      background: #f8fafc;
      color: #344054;
      font-size: 13px;
    }
    td.num, th.num {
      text-align: right;
      white-space: nowrap;
    }
    tr:last-child td { border-bottom: 0; }
    .empty {
      padding: 24px 12px;
      color: var(--muted);
      text-align: center;
    }
    .error-box {
      margin-top: 12px;
      padding: 12px;
      border: 1px solid #fecdca;
      border-radius: 8px;
      background: #fff5f5;
      color: var(--danger);
      display: none;
    }
    .source {
      margin-top: 12px;
      color: var(--muted);
      font-size: 12px;
    }

    @media (max-width: 920px) {
      .layout { grid-template-columns: 1fr; }
      .summary { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (max-width: 620px) {
      main { padding: 18px 10px 28px; }
      .controls, .summary { grid-template-columns: 1fr; }
      h1 { font-size: 22px; }
    }
  </style>
</head>
<body>
<main>
  <h1>관세청 과세환율 주문 그룹 계산기</h1>

  <div class="layout">
    <section class="panel">
      <h2>장바구니 HTML</h2>
      <label for="cartHtml">HTML 붙여넣기</label>
      <textarea id="cartHtml" spellcheck="false" placeholder="Webike 장바구니의 table-cart HTML을 여기에 붙여넣으세요."></textarea>
      <div class="button-row">
        <button type="button" id="analyzeButton">분석하기</button>
        <button type="button" class="secondary" id="clearButton">초기화</button>
      </div>
      <div id="errorBox" class="error-box" role="alert"></div>
    </section>

    <aside class="panel">
      <h2>계산 기준</h2>
      <div class="controls">
        <div>
          <label for="limitUsd">면세 기준(USD)</label>
          <input id="limitUsd" type="number" min="1" step="0.01" value="150">
        </div>
        <div>
          <label for="usdKrw">USD 수입환율(원)</label>
          <input id="usdKrw" type="number" min="1" step="0.01" value="1476.92">
        </div>
        <div>
          <label for="jpyKrw">JPY 수입환율(원)</label>
          <input id="jpyKrw" type="number" min="0.0001" step="0.001" value="9.272">
        </div>
        <div>
          <label for="maxGroups">최대 주문 수</label>
          <input id="maxGroups" type="number" min="1" step="1" value="8">
        </div>
        <div class="wide check-row">
          <input id="splitQuantity" type="checkbox" checked>
          <span>같은 상품 수량 분할 허용</span>
        </div>
      </div>
      <p class="note">
        관세청 고시 수입환율은 주 단위로 바뀝니다. 주문 또는 입항 예상 주차의 값을 입력하세요.
      </p>
      <p class="source">
        기본값: 적용기간 2026-04-26 ~ 2026-05-02, USD 1,476.92원, JPY 9.272원.
        <a href="https://www.forwarder.kr/curr/index.php?curr=ex_rate" target="_blank" rel="noopener noreferrer">관세청 고시환율 조회</a>
      </p>
    </aside>
  </div>

  <section id="resultArea" aria-live="polite">
    <div class="empty">분석 결과가 여기에 표시됩니다.</div>
  </section>
</main>

<script>
  const $ = (selector) => document.querySelector(selector);
  const formatter = new Intl.NumberFormat("ko-KR");

  function toNumber(value) {
    const number = Number(String(value || "").replace(/,/g, "").trim());
    return Number.isFinite(number) ? number : 0;
  }

  function parseJpy(text) {
    const match = String(text || "").match(/([\d,]+(?:\.\d+)?)\s*JPY/i);
    return match ? Math.round(toNumber(match[1])) : 0;
  }

  function cleanText(text) {
    return String(text || "").replace(/\s+/g, " ").trim();
  }

  function money(value, digits = 0) {
    return Number(value || 0).toLocaleString("ko-KR", {
      minimumFractionDigits: digits,
      maximumFractionDigits: digits,
    });
  }

  function parseProducts(html) {
    const doc = new DOMParser().parseFromString(html, "text/html");
    const rows = [...doc.querySelectorAll(".table-cart tbody tr.item, tr[id^='product-item'], tr[data-sku]")];

    return rows.map((row, index) => {
      const quantityInput = row.querySelector(".product-quantity, .qty-inp, input[name='quantity']");
      const quantity = Math.max(1, Math.round(toNumber(quantityInput?.value || quantityInput?.getAttribute("value") || 1)));
      const unitJpy = parseJpy(row.querySelector(".unit-sub-price")?.textContent);
      const totalJpy = parseJpy(row.querySelector(".total-sub-price")?.textContent) || (unitJpy * quantity);
      const resolvedUnitJpy = unitJpy || Math.round(totalJpy / quantity);
      const code = cleanText(row.querySelector(".product-code .code")?.textContent) ||
        cleanText(row.querySelector("input[name='prdSku']")?.value) ||
        row.dataset.sku ||
        row.id.replace("product-item-", "") ||
        `item-${index + 1}`;
      const name = cleanText(row.querySelector(".product-name a")?.textContent) ||
        cleanText(row.querySelector(".product-name")?.textContent) ||
        code;

      return {
        index,
        sku: row.dataset.sku || row.id.replace("product-item-", "") || code,
        code,
        name,
        quantity,
        unitJpy: resolvedUnitJpy,
        totalJpy: totalJpy || resolvedUnitJpy * quantity,
      };
    }).filter((item) => item.quantity > 0 && item.unitJpy > 0);
  }

  function makeAtoms(products, splitQuantity) {
    const atoms = [];
    products.forEach((product) => {
      if (splitQuantity) {
        for (let count = 0; count < product.quantity; count += 1) {
          atoms.push({
            productIndex: product.index,
            code: product.code,
            name: product.name,
            quantity: 1,
            unitJpy: product.unitJpy,
            totalJpy: product.unitJpy,
          });
        }
        return;
      }

      atoms.push({
        productIndex: product.index,
        code: product.code,
        name: product.name,
        quantity: product.quantity,
        unitJpy: product.unitJpy,
        totalJpy: product.totalJpy,
      });
    });
    return atoms;
  }

  function twoGroupDp(atoms, limitJpy) {
    const total = atoms.reduce((sum, item) => sum + item.totalJpy, 0);
    const dp = new Map([[0, null]]);

    atoms.forEach((atom, index) => {
      const entries = [...dp.keys()];
      entries.forEach((sum) => {
        const next = sum + atom.totalJpy;
        if (next <= limitJpy && !dp.has(next)) {
          dp.set(next, { previous: sum, index });
        }
      });
    });

    let bestSum = null;
    dp.forEach((_, sum) => {
      const other = total - sum;
      if (other > limitJpy) return;
      if (bestSum === null || Math.abs(total / 2 - sum) < Math.abs(total / 2 - bestSum)) {
        bestSum = sum;
      }
    });

    if (bestSum === null) return null;

    const selected = new Set();
    let cursor = bestSum;
    while (cursor > 0) {
      const node = dp.get(cursor);
      selected.add(node.index);
      cursor = node.previous;
    }

    const groups = [[], []];
    atoms.forEach((atom, index) => {
      groups[selected.has(index) ? 0 : 1].push(atom);
    });
    return groups;
  }

  function firstFitDecreasing(atoms, groupCount, limitJpy) {
    const groups = Array.from({ length: groupCount }, () => []);
    const sums = Array(groupCount).fill(0);
    const sorted = [...atoms].sort((a, b) => b.totalJpy - a.totalJpy);

    for (const atom of sorted) {
      let target = -1;
      let lowestSum = Infinity;
      for (let index = 0; index < groupCount; index += 1) {
        if (sums[index] + atom.totalJpy <= limitJpy && sums[index] < lowestSum) {
          target = index;
          lowestSum = sums[index];
        }
      }
      if (target === -1) return null;
      groups[target].push(atom);
      sums[target] += atom.totalJpy;
    }

    return groups.filter((group) => group.length > 0);
  }

  function recommendGroups(products, settings) {
    const atoms = makeAtoms(products, settings.splitQuantity);
    const totalJpy = atoms.reduce((sum, item) => sum + item.totalJpy, 0);
    const oversize = atoms.filter((item) => item.totalJpy > settings.limitJpy);
    if (oversize.length) {
      return { totalJpy, groups: [], oversize, atoms };
    }

    const minimumGroups = Math.max(1, Math.ceil(totalJpy / settings.limitJpy));
    if (minimumGroups === 1) {
      return { totalJpy, groups: [atoms], oversize: [], atoms };
    }

    if (minimumGroups === 2) {
      const exactTwoGroups = twoGroupDp(atoms, settings.limitJpy);
      if (exactTwoGroups) {
        return { totalJpy, groups: exactTwoGroups, oversize: [], atoms };
      }
    }

    for (let count = minimumGroups; count <= settings.maxGroups; count += 1) {
      const groups = firstFitDecreasing(atoms, count, settings.limitJpy);
      if (groups) {
        return { totalJpy, groups, oversize: [], atoms };
      }
    }

    return { totalJpy, groups: [], oversize: [], atoms };
  }

  function aggregateGroup(group) {
    const map = new Map();
    group.forEach((atom) => {
      const key = `${atom.productIndex}:${atom.code}`;
      const current = map.get(key) || {
        code: atom.code,
        name: atom.name,
        quantity: 0,
        unitJpy: atom.unitJpy,
        subtotalJpy: 0,
      };
      current.quantity += atom.quantity;
      current.subtotalJpy += atom.totalJpy;
      map.set(key, current);
    });
    return [...map.values()].sort((a, b) => b.subtotalJpy - a.subtotalJpy);
  }

  function renderSummary(products, recommendation, settings) {
    const totalKrw = recommendation.totalJpy * settings.jpyKrw;
    const totalUsd = totalKrw / settings.usdKrw;
    const limitKrw = settings.limitUsd * settings.usdKrw;
    const statusText = recommendation.groups.length ? "가능" : "확인 필요";
    const statusClass = recommendation.groups.length ? "ok" : "warn";

    return `
      <section class="summary" aria-label="요약">
        <div class="metric"><span>추출 상품</span><b>${products.length}종</b><small>${recommendation.atoms.length}개 단위 계산</small></div>
        <div class="metric"><span>전체 상품가</span><b>${money(recommendation.totalJpy)} JPY</b><small>약 ${money(totalUsd, 2)} USD</small></div>
        <div class="metric"><span>150달러 한도</span><b>${money(Math.floor(settings.limitJpy))} JPY</b><small>${money(limitKrw)}원</small></div>
        <div class="metric"><span>주문 분할</span><b class="${statusClass}">${statusText}</b><small>${recommendation.groups.length || "-"}개 주문</small></div>
      </section>
    `;
  }

  function renderProducts(products) {
    const rows = products.map((item) => `
      <tr>
        <td>${item.code}</td>
        <td>${item.name}</td>
        <td class="num">${formatter.format(item.quantity)}</td>
        <td class="num">${formatter.format(item.unitJpy)}</td>
        <td class="num">${formatter.format(item.totalJpy)}</td>
      </tr>
    `).join("");

    return `
      <section class="panel">
        <h2>추출된 상품</h2>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>상품번호</th>
                <th>상품명</th>
                <th class="num">수량</th>
                <th class="num">단가(JPY)</th>
                <th class="num">소계(JPY)</th>
              </tr>
            </thead>
            <tbody>${rows}</tbody>
          </table>
        </div>
      </section>
    `;
  }

  function renderGroups(recommendation, settings) {
    if (recommendation.oversize.length) {
      const list = recommendation.oversize.map((item) => `<li>${item.code} - ${item.name}: ${money(item.totalJpy)} JPY</li>`).join("");
      return `<section class="panel"><h2>그룹 추천</h2><p class="bad">단일 품목이 한도를 초과했습니다.</p><ul>${list}</ul></section>`;
    }

    if (!recommendation.groups.length) {
      return `<section class="panel"><h2>그룹 추천</h2><p class="warn">지정한 최대 주문 수 안에서 한도 이하 그룹을 찾지 못했습니다.</p></section>`;
    }

    const cards = recommendation.groups.map((group, index) => {
      const totalJpy = group.reduce((sum, item) => sum + item.totalJpy, 0);
      const totalKrw = totalJpy * settings.jpyKrw;
      const totalUsd = totalKrw / settings.usdKrw;
      const marginUsd = settings.limitUsd - totalUsd;
      const marginJpy = settings.limitJpy - totalJpy;
      const rows = aggregateGroup(group).map((item) => `
        <tr>
          <td>${item.code}</td>
          <td>${item.name}</td>
          <td class="num">${formatter.format(item.quantity)}</td>
          <td class="num">${formatter.format(item.unitJpy)}</td>
          <td class="num">${formatter.format(item.subtotalJpy)}</td>
        </tr>
      `).join("");

      return `
        <article class="group-card">
          <div class="group-head">
            <div><b>주문 ${index + 1}</b> <span class="badge">약 ${money(totalUsd, 2)} USD</span></div>
            <div class="${marginUsd >= 0 ? "ok" : "bad"}">여유 약 ${money(marginUsd, 2)} USD / ${money(Math.floor(marginJpy))} JPY</div>
          </div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>상품번호</th>
                  <th>상품명</th>
                  <th class="num">수량</th>
                  <th class="num">단가(JPY)</th>
                  <th class="num">소계(JPY)</th>
                </tr>
              </thead>
              <tbody>
                ${rows}
                <tr>
                  <td colspan="4"><b>합계 / 약 ${money(totalKrw)}원</b></td>
                  <td class="num"><b>${money(totalJpy)}</b></td>
                </tr>
              </tbody>
            </table>
          </div>
        </article>
      `;
    }).join("");

    return `<section class="group-grid"><h2>추천 주문 그룹</h2>${cards}</section>`;
  }

  function getSettings() {
    const limitUsd = toNumber($("#limitUsd").value);
    const usdKrw = toNumber($("#usdKrw").value);
    const jpyKrw = toNumber($("#jpyKrw").value);
    const maxGroups = Math.max(1, Math.round(toNumber($("#maxGroups").value)));

    return {
      limitUsd,
      usdKrw,
      jpyKrw,
      maxGroups,
      splitQuantity: $("#splitQuantity").checked,
      limitJpy: (limitUsd * usdKrw) / jpyKrw,
    };
  }

  function showError(message) {
    const errorBox = $("#errorBox");
    errorBox.textContent = message;
    errorBox.style.display = "block";
  }

  function clearError() {
    const errorBox = $("#errorBox");
    errorBox.textContent = "";
    errorBox.style.display = "none";
  }

  function analyze() {
    clearError();
    const html = $("#cartHtml").value.trim();
    const settings = getSettings();

    if (!html) {
      showError("분석할 HTML을 붙여넣어 주세요.");
      return;
    }
    if (!settings.limitUsd || !settings.usdKrw || !settings.jpyKrw) {
      showError("면세 기준과 환율 값을 확인해 주세요.");
      return;
    }

    const products = parseProducts(html);
    if (!products.length) {
      showError("상품 행을 찾지 못했습니다. table-cart 영역의 HTML을 붙여넣었는지 확인해 주세요.");
      return;
    }

    const recommendation = recommendGroups(products, settings);
    $("#resultArea").innerHTML = [
      renderSummary(products, recommendation, settings),
      renderGroups(recommendation, settings),
      renderProducts(products),
    ].join("");
  }

  $("#analyzeButton").addEventListener("click", analyze);
  $("#clearButton").addEventListener("click", () => {
    $("#cartHtml").value = "";
    clearError();
    $("#resultArea").innerHTML = '<div class="empty">분석 결과가 여기에 표시됩니다.</div>';
  });
</script>
</body>
</html>
