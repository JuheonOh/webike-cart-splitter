<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>관세청 과세환율 주문 그룹 계산기</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f4f6f8;
      --panel: #fff;
      --text: #202631;
      --muted: #657286;
      --line: #d9e0e8;
      --head: #edf2f7;
      --accent: #1264a3;
      --success: #087443;
      --danger: #b42318;
      --warn: #b54708;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, "Noto Sans KR", sans-serif;
      line-height: 1.5;
    }
    main {
      max-width: 1320px;
      margin: 0 auto;
      padding: 24px 16px 36px;
    }
    h1 {
      margin: 0 0 18px;
      font-size: 26px;
      letter-spacing: 0;
    }
    h2 {
      margin: 0 0 12px;
      font-size: 18px;
      letter-spacing: 0;
    }
    label {
      display: block;
      margin: 0 0 6px;
      font-size: 13px;
      font-weight: 700;
      color: #344054;
    }
    input, textarea, button {
      font: inherit;
    }
    input, textarea {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fff;
      color: var(--text);
    }
    input {
      height: 40px;
      padding: 0 10px;
    }
    textarea {
      min-height: 280px;
      padding: 12px;
      resize: vertical;
      font-family: Consolas, "Courier New", monospace;
      font-size: 13px;
    }
    button {
      border: 0;
      border-radius: 6px;
      padding: 10px 14px;
      background: var(--accent);
      color: #fff;
      font-weight: 700;
      cursor: pointer;
    }
    button.secondary {
      background: #475467;
    }
    button.danger {
      background: var(--danger);
    }
    button.compact {
      padding: 7px 10px;
      font-size: 13px;
    }
    button:disabled {
      background: #98a2b3;
      cursor: not-allowed;
    }
    button:focus-visible,
    input:focus-visible,
    textarea:focus-visible {
      outline: 3px solid rgba(18, 100, 163, .22);
      outline-offset: 1px;
    }
    a { color: var(--accent); }
    .layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 340px;
      gap: 16px;
      align-items: start;
    }
    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 16px;
    }
    .controls {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }
    .wide { grid-column: 1 / -1; }
    .button-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 12px;
    }
    .section-head {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }
    .mode-control {
      display: inline-flex;
      flex-wrap: wrap;
      gap: 4px;
      padding: 4px;
      margin-bottom: 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #f8fafc;
    }
    .mode-option {
      display: flex;
      align-items: center;
      gap: 6px;
      margin: 0;
      padding: 7px 10px;
      border-radius: 6px;
      color: var(--muted);
      cursor: pointer;
    }
    .mode-option input {
      width: 16px;
      height: 16px;
    }
    .mode-option:has(input:checked) {
      background: #fff;
      color: var(--text);
      box-shadow: 0 0 0 1px rgba(18, 100, 163, .16);
    }
    .input-panel[hidden] {
      display: none;
    }
    .manual-table table {
      min-width: 860px;
    }
    .manual-table th:last-child,
    .manual-table td:last-child {
      width: 72px;
      text-align: center;
    }
    .manual-table input {
      height: 36px;
    }
    .check-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 10px;
      color: var(--muted);
      font-size: 13px;
    }
    .check-row input {
      width: 18px;
      height: 18px;
    }
    .note {
      margin: 12px 0 0;
      color: var(--muted);
      font-size: 13px;
    }
    .summary {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
      margin: 16px 0;
    }
    .metric {
      background: #fff;
      border: 1px solid var(--line);
      border-left: 4px solid var(--accent);
      border-radius: 8px;
      padding: 12px;
      min-height: 92px;
    }
    .metric span {
      display: block;
      color: var(--muted);
      font-size: 13px;
    }
    .metric b {
      display: block;
      margin-top: 4px;
      font-size: 20px;
      color: var(--text);
    }
    .metric small {
      display: block;
      margin-top: 3px;
      color: var(--muted);
    }
    .ok { color: var(--success); font-weight: 700; }
    .bad { color: var(--danger); font-weight: 700; }
    .warn { color: var(--warn); font-weight: 700; }
    .group-grid {
      display: grid;
      gap: 14px;
    }
    .group-card {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: hidden;
    }
    .group-head {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 8px;
      padding: 12px 14px;
      background: var(--head);
      border-bottom: 1px solid var(--line);
    }
    .group-head b {
      font-size: 17px;
    }
    .badge {
      display: inline-block;
      border-radius: 999px;
      padding: 2px 8px;
      background: #e7f6ed;
      color: var(--success);
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
    }
    .table-wrap {
      overflow-x: auto;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 760px;
    }
    th, td {
      padding: 9px 10px;
      border-bottom: 1px solid var(--line);
      text-align: left;
      vertical-align: top;
      font-size: 14px;
    }
    th {
      background: #f8fafc;
      color: #344054;
      font-size: 13px;
    }
    td.num, th.num {
      text-align: right;
      white-space: nowrap;
    }
    tr:last-child td { border-bottom: 0; }
    .empty {
      padding: 24px 12px;
      color: var(--muted);
      text-align: center;
    }
    .error-box {
      margin-top: 12px;
      padding: 12px;
      border: 1px solid #fecdca;
      border-radius: 8px;
      background: #fff5f5;
      color: var(--danger);
      display: none;
    }
    .source {
      margin-top: 12px;
      color: var(--muted);
      font-size: 12px;
    }

    @media (max-width: 920px) {
      .layout { grid-template-columns: 1fr; }
      .summary { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (max-width: 620px) {
      main { padding: 18px 10px 28px; }
      .controls, .summary { grid-template-columns: 1fr; }
      h1 { font-size: 22px; }
      .mode-control { width: 100%; }
      .mode-option { flex: 1 1 100%; }
    }
  </style>
</head>
<body>
<main>
  <h1>관세청 과세환율 주문 그룹 계산기</h1>

  <div class="layout">
    <section class="panel">
      <h2>상품 입력</h2>
      <div class="mode-control" aria-label="입력 방식">
        <label class="mode-option">
          <input type="radio" name="inputMode" value="html" checked>
          <span>장바구니 HTML</span>
        </label>
        <label class="mode-option">
          <input type="radio" name="inputMode" value="manual">
          <span>직접 입력</span>
        </label>
      </div>

      <div id="htmlInputPanel" class="input-panel">
        <label for="cartHtml">HTML 붙여넣기</label>
        <textarea id="cartHtml" spellcheck="false" placeholder="Webike 장바구니의 table-cart HTML을 여기에 붙여넣으세요."></textarea>
      </div>

      <div id="manualInputPanel" class="input-panel" hidden>
        <div class="table-wrap manual-table">
          <table id="manualTable">
            <thead>
              <tr>
                <th>상품번호</th>
                <th>상품명</th>
                <th class="num">수량</th>
                <th class="num">단가(JPY)</th>
                <th>삭제</th>
              </tr>
            </thead>
            <tbody id="manualRows"></tbody>
          </table>
        </div>
        <div class="button-row">
          <button type="button" class="secondary compact" id="addManualRowButton">행 추가</button>
        </div>
      </div>

      <div class="button-row">
        <button type="button" id="analyzeButton">분석하기</button>
        <button type="button" id="exportXlsxButton" disabled>XLSX 내보내기</button>
        <button type="button" class="secondary" id="clearButton">초기화</button>
      </div>
      <div id="errorBox" class="error-box" role="alert"></div>
    </section>

    <aside class="panel">
      <h2>계산 기준</h2>
      <div class="controls">
        <div>
          <label for="limitUsd">면세 기준(USD)</label>
          <input id="limitUsd" type="number" min="1" step="0.01" value="150">
        </div>
        <div>
          <label for="usdKrw">USD 수입환율(원)</label>
          <input id="usdKrw" type="number" min="1" step="0.01" value="1476.92">
        </div>
        <div>
          <label for="jpyKrw">JPY 수입환율(원)</label>
          <input id="jpyKrw" type="number" min="0.0001" step="0.001" value="9.272">
        </div>
        <div>
          <label for="maxGroups">최대 주문 수</label>
          <input id="maxGroups" type="number" min="1" step="1" value="8">
        </div>
        <div class="wide check-row">
          <input id="splitQuantity" type="checkbox" checked>
          <span>같은 상품 수량 분할 허용</span>
        </div>
      </div>
      <p class="note">
        관세청 고시 수입환율은 주 단위로 바뀝니다. 주문 또는 입항 예상 주차의 값을 입력하세요.
      </p>
      <p class="source">
        기본값: 적용기간 2026-04-26 ~ 2026-05-02, USD 1,476.92원, JPY 9.272원.
        <a href="https://www.forwarder.kr/curr/index.php?curr=ex_rate" target="_blank" rel="noopener noreferrer">관세청 고시환율 조회</a>
      </p>
    </aside>
  </div>

  <section id="resultArea" aria-live="polite">
    <div class="empty">분석 결과가 여기에 표시됩니다.</div>
  </section>
</main>

<script>
  const $ = (selector) => document.querySelector(selector);
  const formatter = new Intl.NumberFormat("ko-KR");
  let latestAnalysis = null;
  const XLSX_MIME_TYPE = "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet";
  const CART_ROW_SELECTORS = [
    ".table-cart tbody tr.item",
    ".table-cart tbody tr[id^='product-item']",
    ".table-cart tbody tr[data-sku]",
    ".table-cart tbody tr[data-product-code]",
    ".table-cart tbody tr[data-product-id]",
    ".table-cart tbody tr",
    "tr[id^='product-item']",
    "tr[data-sku]",
    "tr[data-product-code]",
    "tr[data-product-id]",
    ".cart-item",
    ".cart-list-item",
    "[data-cart-item]",
  ];
  const PRODUCT_CODE_SELECTORS = [
    ".product-code .code",
    ".product-code",
    ".goods-code",
    ".item-code",
    ".sku",
    "[data-product-code]",
    "[data-sku]",
    "input[name='prdSku']",
    "input[name='sku']",
    "input[name='productCode']",
    "input[name='product_code']",
  ];
  const PRODUCT_NAME_SELECTORS = [
    ".product-name a",
    ".product-name",
    ".goods-name a",
    ".goods-name",
    ".item-name a",
    ".item-name",
    ".product-title a",
    ".product-title",
    "[data-product-name]",
  ];
  const QUANTITY_SELECTORS = [
    ".product-quantity",
    ".qty-inp",
    ".quantity input",
    ".quantity",
    ".qty",
    "input[name='quantity']",
    "input[name='qty']",
    "input[name*='quantity' i]",
    "input[name*='qty' i]",
    "select[name*='quantity' i]",
    "select[name*='qty' i]",
    "[data-quantity]",
    "[data-qty]",
  ];
  const UNIT_PRICE_SELECTORS = [
    ".unit-sub-price",
    ".unit-price",
    ".price-unit",
    ".product-price",
    ".item-price",
    ".price",
    "[data-unit-price]",
    "[data-price]",
  ];
  const TOTAL_PRICE_SELECTORS = [
    ".total-sub-price",
    ".subtotal-price",
    ".subtotal",
    ".total-price",
    ".line-total",
    ".amount",
    "[data-total-price]",
    "[data-subtotal]",
  ];

  function toNumber(value) {
    const number = Number(String(value || "").replace(/,/g, "").trim());
    return Number.isFinite(number) ? number : 0;
  }

  function firstNumber(value) {
    const match = String(value || "").match(/[\d,]+(?:\.\d+)?/);
    return match ? toNumber(match[0]) : 0;
  }

  function parseJpy(text) {
    const value = String(text || "").replace(/\u00a0/g, " ");
    const patterns = [
      /(?:JPY|￥|¥)\s*([\d,]+(?:\.\d+)?)/i,
      /([\d,]+(?:\.\d+)?)\s*(?:JPY|円)/i,
    ];

    for (const pattern of patterns) {
      const match = value.match(pattern);
      if (match) return Math.round(toNumber(match[1]));
    }

    return /^[\s\d,.]+$/.test(value) ? Math.round(firstNumber(value)) : 0;
  }

  function cleanText(text) {
    return String(text || "").replace(/\s+/g, " ").trim();
  }

  function datasetValue(element, keys) {
    for (const key of keys) {
      const value = element?.dataset?.[key];
      if (value !== undefined && value !== null && String(value).trim()) {
        return cleanText(value);
      }
    }
    return "";
  }

  function attributeValue(element, names) {
    for (const name of names) {
      const value = element?.getAttribute?.(name);
      if (value !== undefined && value !== null && String(value).trim()) {
        return cleanText(value);
      }
    }
    return "";
  }

  function firstElement(root, selectors) {
    for (const selector of selectors) {
      const element = root?.querySelector?.(selector);
      if (element) return element;
    }
    return null;
  }

  function textFrom(root, selectors) {
    const element = firstElement(root, selectors);
    return cleanText(element?.textContent) ||
      cleanText(element?.value) ||
      attributeValue(element, ["value", "title", "aria-label"]);
  }

  function productCodeFromRow(row) {
    return textFrom(row, PRODUCT_CODE_SELECTORS) ||
      datasetValue(row, ["sku", "productCode", "productId", "code"]) ||
      attributeValue(row, ["data-sku", "data-product-code", "data-product-id"]);
  }

  function productNameFromRow(row) {
    return textFrom(row, PRODUCT_NAME_SELECTORS) ||
      datasetValue(row, ["productName", "name"]) ||
      attributeValue(row, ["data-product-name", "title", "aria-label"]);
  }

  function productCodeFromId(id) {
    const value = cleanText(id);
    if (!value) return "";
    const cleaned = value.replace(/^(product-item|cart-item|item)[_-]?/i, "");
    if (cleaned !== value) return cleanText(cleaned);
    return /^[A-Z0-9][A-Z0-9._-]{4,}$/i.test(value) ? value : "";
  }

  function priceFromRow(row, selectors, datasetKeys, attributeNames) {
    for (const selector of selectors) {
      const element = row?.querySelector?.(selector);
      const parsed = parseJpy(
        cleanText(element?.textContent) ||
        cleanText(element?.value) ||
        attributeValue(element, ["value", "data-price", "data-unit-price", "data-total-price", "data-subtotal"]),
      );
      if (parsed > 0) return parsed;
    }

    const dataValue = datasetValue(row, datasetKeys);
    if (dataValue) {
      const parsed = parseJpy(dataValue);
      if (parsed > 0) return parsed;
    }

    const attrValue = attributeValue(row, attributeNames);
    if (attrValue) {
      const parsed = parseJpy(attrValue);
      if (parsed > 0) return parsed;
    }

    return 0;
  }

  function quantityFromRow(row) {
    const quantityText = textFrom(row, QUANTITY_SELECTORS) ||
      datasetValue(row, ["quantity", "qty"]) ||
      attributeValue(row, ["data-quantity", "data-qty"]);
    const quantity = firstNumber(quantityText);
    if (quantity > 0) return Math.max(1, Math.round(quantity));

    const rowMatch = cleanText(row?.textContent).match(/(?:수량|数量|qty|quantity)\s*[:：]?\s*([\d,]+)/i);
    return rowMatch ? Math.max(1, Math.round(toNumber(rowMatch[1]))) : 1;
  }

  function hasProductSignal(row) {
    const hasIdentity = Boolean(productCodeFromRow(row) || productNameFromRow(row) || productCodeFromId(row?.id));
    const hasPrice = Boolean(
      priceFromRow(row, UNIT_PRICE_SELECTORS, ["unitJpy", "unitPrice", "price"], ["data-unit-price", "data-price"]) ||
      priceFromRow(row, TOTAL_PRICE_SELECTORS, ["totalJpy", "totalPrice", "subtotal"], ["data-total-price", "data-subtotal"]),
    );
    return hasIdentity && hasPrice;
  }

  function money(value, digits = 0) {
    return Number(value || 0).toLocaleString("ko-KR", {
      minimumFractionDigits: digits,
      maximumFractionDigits: digits,
    });
  }

  function setExportEnabled(enabled) {
    $("#exportXlsxButton").disabled = !enabled;
  }

  function resetExportData() {
    latestAnalysis = null;
    setExportEnabled(false);
  }

  function escapeXml(value) {
    return String(value ?? "").replace(/[<>&'"]/g, (char) => ({
      "<": "&lt;",
      ">": "&gt;",
      "&": "&amp;",
      "'": "&apos;",
      '"': "&quot;",
    }[char]));
  }

  function escapeHtml(value) {
    return escapeXml(value);
  }

  function xlsxCell(value, style = "", type = "") {
    return { value, style, type };
  }

  function pad(number) {
    return String(number).padStart(2, "0");
  }

  function makeXlsxFileName() {
    const now = new Date();
    return [
      "webike_cart_groups_",
      now.getFullYear(),
      pad(now.getMonth() + 1),
      pad(now.getDate()),
      "_",
      pad(now.getHours()),
      pad(now.getMinutes()),
      ".xlsx",
    ].join("");
  }

  function groupTotals(group, settings) {
    const totalJpy = group.reduce((sum, item) => sum + item.totalJpy, 0);
    const totalKrw = totalJpy * settings.jpyKrw;
    const totalUsd = totalKrw / settings.usdKrw;
    return {
      totalJpy,
      totalKrw,
      totalUsd,
      marginUsd: settings.limitUsd - totalUsd,
      marginKrw: (settings.limitUsd * settings.usdKrw) - totalKrw,
    };
  }

  function buildSummaryRows(products, recommendation, settings) {
    const totalKrw = recommendation.totalJpy * settings.jpyKrw;
    const totalUsd = totalKrw / settings.usdKrw;
    return [
      [xlsxCell("항목", "header"), xlsxCell("값", "header")],
      [xlsxCell("면세 기준(USD)", "label"), xlsxCell(settings.limitUsd, "decimal")],
      [xlsxCell("USD 수입환율(원)", "label"), xlsxCell(settings.usdKrw, "decimal")],
      [xlsxCell("JPY 수입환율(원)", "label"), xlsxCell(settings.jpyKrw, "decimal")],
      [xlsxCell("JPY 한도", "label"), xlsxCell(Math.floor(settings.limitJpy), "integer")],
      [xlsxCell("전체 상품가 JPY", "label"), xlsxCell(recommendation.totalJpy, "integer")],
      [xlsxCell("전체 상품가 USD", "label"), xlsxCell(totalUsd, "decimal")],
      [xlsxCell("전체 상품가 KRW", "label"), xlsxCell(Math.round(totalKrw), "integer")],
      [xlsxCell("추출 상품 수", "label"), xlsxCell(products.length, "integer")],
      [xlsxCell("계산 단위 수", "label"), xlsxCell(recommendation.atoms.length, "integer")],
      [xlsxCell("추천 주문 수", "label"), xlsxCell(recommendation.groups.length, "integer")],
      [xlsxCell("분할 상태", "label"), xlsxCell(recommendation.groups.length ? "가능" : "확인 필요")],
    ];
  }

  function buildGroupRows(products, recommendation, settings) {
    const productHeader = [
      xlsxCell("주문그룹", "header"),
      xlsxCell("상품번호", "header"),
      xlsxCell("상품명", "header"),
      xlsxCell("수량", "header"),
      xlsxCell("단가JPY", "header"),
      xlsxCell("소계JPY", "header"),
      xlsxCell("소계KRW", "header"),
    ];
    const rows = [];

    if (recommendation.groups.length) {
      recommendation.groups.forEach((group, index) => {
        const totals = groupTotals(group, settings);
        const groupItems = aggregateGroup(group);
        const summaryRows = [
          [xlsxCell("그룹합계JPY", "label"), xlsxCell(totals.totalJpy, "totalInteger")],
          [xlsxCell("그룹합계USD", "label"), xlsxCell(totals.totalUsd, "totalDecimal")],
          [xlsxCell("그룹합계KRW", "label"), xlsxCell(Math.round(totals.totalKrw), "totalInteger")],
          [xlsxCell("여유USD", "label"), xlsxCell(totals.marginUsd, "totalDecimal")],
          [xlsxCell("여유KRW", "label"), xlsxCell(Math.round(totals.marginKrw), "totalInteger")],
        ];
        const bodyRowCount = Math.max(groupItems.length, summaryRows.length);

        rows.push([
          ...productHeader,
          xlsxCell("", "boxSpacer"),
          xlsxCell(`주문 ${index + 1} 요약`, "totalText"),
          xlsxCell("", "totalText"),
        ]);
        for (let rowIndex = 0; rowIndex < bodyRowCount; rowIndex += 1) {
          const item = groupItems[rowIndex];
          const productCells = item ? [
            xlsxCell(index + 1, "boxInteger"),
            xlsxCell(item.code, "boxText"),
            xlsxCell(item.name, "boxText"),
            xlsxCell(item.quantity, "boxInteger"),
            xlsxCell(item.unitJpy, "boxInteger"),
            xlsxCell(item.subtotalJpy, "boxInteger"),
            xlsxCell(Math.round(item.subtotalJpy * settings.jpyKrw), "boxInteger"),
          ] : Array.from({ length: productHeader.length }, () => xlsxCell("", "boxSpacer"));
          const summaryCells = summaryRows[rowIndex] || [xlsxCell("", "boxSpacer"), xlsxCell("", "boxSpacer")];
          rows.push([
            ...productCells,
            xlsxCell("", "boxSpacer"),
            ...summaryCells,
          ]);
        }
        if (index < recommendation.groups.length - 1) {
          rows.push([]);
        }
      });
      return rows;
    }

    rows.push(productHeader);
    products.forEach((item) => {
      rows.push([
        xlsxCell("", "boxSpacer"),
        xlsxCell(item.code, "boxText"),
        xlsxCell(item.name, "boxText"),
        xlsxCell(item.quantity, "boxInteger"),
        xlsxCell(item.unitJpy, "boxInteger"),
        xlsxCell(item.totalJpy, "boxInteger"),
        xlsxCell(Math.round(item.totalJpy * settings.jpyKrw), "boxInteger"),
      ]);
    });
    return rows;
  }

  function columnName(index) {
    let name = "";
    while (index > 0) {
      const remainder = (index - 1) % 26;
      name = String.fromCharCode(65 + remainder) + name;
      index = Math.floor((index - 1) / 26);
    }
    return name;
  }

  function worksheetXml(rows, widths) {
    const cols = widths.map((width, index) => (
      `<col min="${index + 1}" max="${index + 1}" width="${width}" customWidth="1"/>`

    const sheetRows = rows.map((row, rowIndex) => {
      const cells = row.map((cell, cellIndex) => {
        const ref = `${columnName(cellIndex + 1)}${rowIndex + 1}`;
        const style = styleId(cell.style);
        const styleAttr = style ? ` s="${style}"` : "";
        if (cell.value === "" || cell.value === null || cell.value === undefined) {
          return style ? `<c r="${ref}"${styleAttr}/>` : "";
        }
        if ((cell.type === "number" || typeof cell.value === "number") && Number.isFinite(Number(cell.value))) {
          return `<c r="${ref}"${styleAttr}><v>${Number(cell.value)}</v></c>`;
        }
        const text = escapeXml(cell.value);
        const spaceAttr = /^\s|\s$/.test(String(cell.value)) ? ' xml:space="preserve"' : "";
        return `<c r="${ref}" t="inlineStr"${styleAttr}><is><t${spaceAttr}>${text}</t></is></c>`;
      }).join("");
      return `<row r="${rowIndex + 1}">${cells}</row>`;
    }).join("");

    return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">
  <cols>${cols}</cols>
  <sheetData>${sheetRows}</sheetData>
</worksheet>`;

  const CRC_TABLE = (() => {
    const table = [];
    for (let index = 0; index < 256; index += 1) {
      let value = index;
      for (let bit = 0; bit < 8; bit += 1) {
        value = (value & 1) ? (0xedb88320 ^ (value >>> 1)) : (value >>> 1);
      }
      table[index] = value >>> 0;
    }
    return table;
  })();

  function crc32(bytes) {
    let crc = 0xffffffff;
    bytes.forEach((byte) => {
      crc = CRC_TABLE[(crc ^ byte) & 0xff] ^ (crc >>> 8);
    });
    return (crc ^ 0xffffffff) >>> 0;
  }

  function dosTimeDate(date) {
    return {
      time: (date.getHours() << 11) | (date.getMinutes() << 5) | Math.floor(date.getSeconds() / 2),
      date: ((date.getFullYear() - 1980) << 9) | ((date.getMonth() + 1) << 5) | date.getDate(),
    };
  }

  function writeUint16(target, value) {
    target.push(value & 0xff, (value >>> 8) & 0xff);
  }

  function writeUint32(target, value) {
    target.push(value & 0xff, (value >>> 8) & 0xff, (value >>> 16) & 0xff, (value >>> 24) & 0xff);
  }

  function bytesFromText(text) {
    return new TextEncoder().encode(text);
  }

  function combineBytes(parts) {
    const size = parts.reduce((sum, part) => sum + part.length, 0);
    const output = new Uint8Array(size);
    let offset = 0;
    parts.forEach((part) => {
      output.set(part, offset);
      offset += part.length;
    });
    return output;
  }

  function createZip(files) {
    const createdAt = dosTimeDate(new Date());
    const localParts = [];
    const centralParts = [];
    let offset = 0;

    files.forEach((file) => {
      const nameBytes = bytesFromText(file.name);
      const dataBytes = typeof file.content === "string" ? bytesFromText(file.content) : file.content;
      const crc = crc32(dataBytes);
      const localHeader = [];

      writeUint32(localHeader, 0x04034b50);
      writeUint16(localHeader, 20);
      writeUint16(localHeader, 0x0800);
      writeUint16(localHeader, 0);
      writeUint16(localHeader, createdAt.time);
      writeUint16(localHeader, createdAt.date);
      writeUint32(localHeader, crc);
      writeUint32(localHeader, dataBytes.length);
      writeUint32(localHeader, dataBytes.length);
      writeUint16(localHeader, nameBytes.length);
      writeUint16(localHeader, 0);
      const localRecord = combineBytes([new Uint8Array(localHeader), nameBytes, dataBytes]);
      localParts.push(localRecord);

      const centralHeader = [];
      writeUint32(centralHeader, 0x02014b50);
      writeUint16(centralHeader, 20);
      writeUint16(centralHeader, 20);
      writeUint16(centralHeader, 0x0800);
      writeUint16(centralHeader, 0);
      writeUint16(centralHeader, createdAt.time);
      writeUint16(centralHeader, createdAt.date);
      writeUint32(centralHeader, crc);
      writeUint32(centralHeader, dataBytes.length);
      writeUint32(centralHeader, dataBytes.length);
      writeUint16(centralHeader, nameBytes.length);
      writeUint16(centralHeader, 0);
      writeUint16(centralHeader, 0);
      writeUint16(centralHeader, 0);
      writeUint16(centralHeader, 0);
      writeUint32(centralHeader, 0);
      writeUint32(centralHeader, offset);
      centralParts.push(combineBytes([new Uint8Array(centralHeader), nameBytes]));
      offset += localRecord.length;
    });

    const centralDirectory = combineBytes(centralParts);
    const endRecord = [];
    writeUint32(endRecord, 0x06054b50);
    writeUint16(endRecord, 0);
    writeUint16(endRecord, 0);
    writeUint16(endRecord, files.length);
    writeUint16(endRecord, files.length);
    writeUint32(endRecord, centralDirectory.length);
    writeUint32(endRecord, offset);
    writeUint16(endRecord, 0);

    return combineBytes([...localParts, centralDirectory, new Uint8Array(endRecord)]);
  }

  function buildXlsxBytes(products, recommendation, settings) {
    const files = [
      { name: "[Content_Types].xml", content: contentTypesXml() },
      { name: "_rels/.rels", content: rootRelsXml() },
      { name: "xl/workbook.xml", content: workbookXml() },
      { name: "xl/_rels/workbook.xml.rels", content: workbookRelsXml() },
      { name: "xl/styles.xml", content: stylesXml() },
      {
        name: "xl/worksheets/sheet1.xml",
        content: worksheetXml(buildSummaryRows(products, recommendation, settings), [24, 18]),
      },
      {
        name: "xl/worksheets/sheet2.xml",
        content: worksheetXml(buildGroupRows(products, recommendation, settings), [12, 20, 42, 10, 12, 12, 14, 4, 16, 16]),
      },
      {
        name: "xl/worksheets/sheet3.xml",
        content: worksheetXml(buildProductRows(products, settings), [20, 48, 10, 12, 12, 14]),
      },
    ];
    return createZip(files);
  }

  function downloadXlsx() {
    if (!latestAnalysis) {
      showError("먼저 분석을 실행해 주세요.");
      return;
    }

    const xlsxBytes = buildXlsxBytes(
      latestAnalysis.products,
      latestAnalysis.recommendation,
      latestAnalysis.settings,
    );
    const blob = new Blob([xlsxBytes], { type: XLSX_MIME_TYPE });
    const link = document.createElement("a");
    const url = URL.createObjectURL(blob);
    link.href = url;
    link.download = makeXlsxFileName();
    document.body.appendChild(link);
    link.click();
    link.remove();
    URL.revokeObjectURL(url);
  }

  function parseProducts(html) {
    const doc = new DOMParser().parseFromString(html, "text/html");
    const rows = [];
    const seen = new Set();

    CART_ROW_SELECTORS.forEach((selector) => {
      doc.querySelectorAll(selector).forEach((row) => {
        if (seen.has(row)) return;
        seen.add(row);
        if (hasProductSignal(row)) rows.push(row);
      });
    });

    const products = [];
    rows.forEach((row) => {
      const product = cartProductFromRow(row, products.length);
      if (product) products.push(product);
    });
    return products;
  }

  function cartProductFromRow(row, index) {
    const quantity = quantityFromRow(row);
    const unitJpy = priceFromRow(row, UNIT_PRICE_SELECTORS, ["unitJpy", "unitPrice", "price"], ["data-unit-price", "data-price"]);
    const totalJpy = priceFromRow(row, TOTAL_PRICE_SELECTORS, ["totalJpy", "totalPrice", "subtotal"], ["data-total-price", "data-subtotal"]) ||
      (unitJpy * quantity);
    const resolvedUnitJpy = unitJpy || (totalJpy ? Math.round(totalJpy / quantity) : 0);
    const code = productCodeFromRow(row) ||
      productCodeFromId(row?.id) ||
      `item-${index + 1}`;
    const name = productNameFromRow(row) || code;

    if (quantity < 1 || resolvedUnitJpy <= 0) return null;

    return {
      index,
      sku: datasetValue(row, ["sku", "productCode", "productId"]) || productCodeFromId(row?.id) || code,
      code,
      name,
      quantity,
      unitJpy: resolvedUnitJpy,
      totalJpy: totalJpy || resolvedUnitJpy * quantity,
    };
  }

  function normalizeManualProducts(rows) {
    const products = [];
    const errors = [];

    rows.forEach((row, rowIndex) => {
      const code = cleanText(row.code);
      const name = cleanText(row.name);
      const quantity = Math.round(toNumber(row.quantity));
      const unitJpy = Math.round(toNumber(row.unitJpy));
      const hasAnyValue = code || name || String(row.quantity || "").trim() || String(row.unitJpy || "").trim();

      if (!hasAnyValue) return;

      if (!code) errors.push(`${rowIndex + 1}행 상품번호를 입력해 주세요.`);
      if (quantity < 1) errors.push(`${rowIndex + 1}행 수량은 1 이상이어야 합니다.`);
      if (unitJpy <= 0) errors.push(`${rowIndex + 1}행 단가 JPY는 1 이상이어야 합니다.`);
      if (!code || quantity < 1 || unitJpy <= 0) return;

      products.push({
        index: products.length,
        sku: code,
        code,
        name: name || code,
        quantity,
        unitJpy,
        totalJpy: quantity * unitJpy,
      });
    });

    return { products, errors };
  }

  function readManualProducts() {
    const rows = [...document.querySelectorAll("#manualRows tr")].map((row) => ({
      code: row.querySelector(".manual-code")?.value,
      name: row.querySelector(".manual-name")?.value,
      quantity: row.querySelector(".manual-quantity")?.value,
      unitJpy: row.querySelector(".manual-unit-jpy")?.value,
    }));
    return normalizeManualProducts(rows);
  }

  function manualRowsFromProducts(products) {
    return products.map((item) => ({
      code: item.code,
      name: item.name,
      quantity: item.quantity,
      unitJpy: item.unitJpy,
    }));
  }

  function makeAtoms(products, splitQuantity) {
    const atoms = [];
    products.forEach((product) => {
      if (splitQuantity) {
        for (let count = 0; count < product.quantity; count += 1) {
          atoms.push({
            productIndex: product.index,
            code: product.code,
            name: product.name,
            quantity: 1,
            unitJpy: product.unitJpy,
            totalJpy: product.unitJpy,
          });
        }
        return;
      }

      atoms.push({
        productIndex: product.index,
        code: product.code,
        name: product.name,
        quantity: product.quantity,
        unitJpy: product.unitJpy,
        totalJpy: product.totalJpy,
      });
    });
    return atoms;
  }

  function twoGroupDp(atoms, limitJpy) {
    const total = atoms.reduce((sum, item) => sum + item.totalJpy, 0);
    const dp = new Map([[0, null]]);

    atoms.forEach((atom, index) => {
      const entries = [...dp.keys()];
      entries.forEach((sum) => {
        const next = sum + atom.totalJpy;
        if (next <= limitJpy && !dp.has(next)) {
          dp.set(next, { previous: sum, index });
        }
      });
    });

    let bestSum = null;
    dp.forEach((_, sum) => {
      const other = total - sum;
      if (other > limitJpy) return;
      if (bestSum === null || Math.abs(total / 2 - sum) < Math.abs(total / 2 - bestSum)) {
        bestSum = sum;
      }
    });

    if (bestSum === null) return null;

    const selected = new Set();
    let cursor = bestSum;
    while (cursor > 0) {
      const node = dp.get(cursor);
      selected.add(node.index);
      cursor = node.previous;
    }

    const groups = [[], []];
    atoms.forEach((atom, index) => {
      groups[selected.has(index) ? 0 : 1].push(atom);
    });
    return groups;
  }

  function firstFitDecreasing(atoms, groupCount, limitJpy) {
    const groups = Array.from({ length: groupCount }, () => []);
    const sums = Array(groupCount).fill(0);
    const sorted = [...atoms].sort((a, b) => b.totalJpy - a.totalJpy);

    for (const atom of sorted) {
      let target = -1;
      let lowestSum = Infinity;
      for (let index = 0; index < groupCount; index += 1) {
        if (sums[index] + atom.totalJpy <= limitJpy && sums[index] < lowestSum) {
          target = index;
          lowestSum = sums[index];
        }
      }
      if (target === -1) return null;
      groups[target].push(atom);
      sums[target] += atom.totalJpy;
    }

    return groups.filter((group) => group.length > 0);
  }

  function recommendGroups(products, settings) {
    const atoms = makeAtoms(products, settings.splitQuantity);
    const totalJpy = atoms.reduce((sum, item) => sum + item.totalJpy, 0);
    const oversize = atoms.filter((item) => item.totalJpy > settings.limitJpy);
    if (oversize.length) {
      return { totalJpy, groups: [], oversize, atoms };
    }

    const minimumGroups = Math.max(1, Math.ceil(totalJpy / settings.limitJpy));
    if (minimumGroups === 1) {
      return { totalJpy, groups: [atoms], oversize: [], atoms };
    }

    if (minimumGroups === 2) {
      const exactTwoGroups = twoGroupDp(atoms, settings.limitJpy);
      if (exactTwoGroups) {
        return { totalJpy, groups: exactTwoGroups, oversize: [], atoms };
      }
    }

    for (let count = minimumGroups; count <= settings.maxGroups; count += 1) {
      const groups = firstFitDecreasing(atoms, count, settings.limitJpy);
      if (groups) {
        return { totalJpy, groups, oversize: [], atoms };
      }
    }

    return { totalJpy, groups: [], oversize: [], atoms };
  }

  function aggregateGroup(group) {
    const map = new Map();
    group.forEach((atom) => {
      const key = `${atom.productIndex}:${atom.code}`;
      const current = map.get(key) || {
        code: atom.code,
        name: atom.name,
        quantity: 0,
        unitJpy: atom.unitJpy,
        subtotalJpy: 0,
      };
      current.quantity += atom.quantity;
      current.subtotalJpy += atom.totalJpy;
      map.set(key, current);
    });
    return [...map.values()].sort((a, b) => b.subtotalJpy - a.subtotalJpy);
  }

  function renderSummary(products, recommendation, settings) {
    const totalKrw = recommendation.totalJpy * settings.jpyKrw;
    const totalUsd = totalKrw / settings.usdKrw;
    const limitKrw = settings.limitUsd * settings.usdKrw;
    const statusText = recommendation.groups.length ? "가능" : "확인 필요";
    const statusClass = recommendation.groups.length ? "ok" : "warn";

    return `
      <section class="summary" aria-label="요약">
        <div class="metric"><span>추출 상품</span><b>${products.length}종</b><small>${recommendation.atoms.length}개 단위 계산</small></div>
        <div class="metric"><span>전체 상품가</span><b>${money(recommendation.totalJpy)} JPY</b><small>약 ${money(totalUsd, 2)} USD</small></div>
        <div class="metric"><span>150달러 한도</span><b>${money(Math.floor(settings.limitJpy))} JPY</b><small>${money(limitKrw)}원</small></div>
        <div class="metric"><span>주문 분할</span><b class="${statusClass}">${statusText}</b><small>${recommendation.groups.length || "-"}개 주문</small></div>
      </section>
    `;
  }

  function renderProducts(products) {
    const rows = products.map((item) => `
      <tr>
        <td>${escapeHtml(item.code)}</td>
        <td>${escapeHtml(item.name)}</td>
        <td class="num">${formatter.format(item.quantity)}</td>
        <td class="num">${formatter.format(item.unitJpy)}</td>
        <td class="num">${formatter.format(item.totalJpy)}</td>
      </tr>
    `).join("");

    return `
      <section class="panel">
        <div class="section-head">
          <h2>추출된 상품</h2>
          <button type="button" class="secondary compact" data-action="copy-products-to-manual">직접 입력으로 가져오기</button>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>상품번호</th>
                <th>상품명</th>
                <th class="num">수량</th>
                <th class="num">단가(JPY)</th>
                <th class="num">소계(JPY)</th>
              </tr>
            </thead>
            <tbody>${rows}</tbody>
          </table>
        </div>
      </section>
    `;
  }

  function renderGroups(recommendation, settings) {
    if (recommendation.oversize.length) {
      const list = recommendation.oversize.map((item) => `<li>${escapeHtml(item.code)} - ${escapeHtml(item.name)}: ${money(item.totalJpy)} JPY</li>`).join("");
      return `<section class="panel"><h2>그룹 추천</h2><p class="bad">단일 품목이 한도를 초과했습니다.</p><ul>${list}</ul></section>`;
    }

    if (!recommendation.groups.length) {
      return `<section class="panel"><h2>그룹 추천</h2><p class="warn">지정한 최대 주문 수 안에서 한도 이하 그룹을 찾지 못했습니다.</p></section>`;
    }

    const cards = recommendation.groups.map((group, index) => {
      const totalJpy = group.reduce((sum, item) => sum + item.totalJpy, 0);
      const totalKrw = totalJpy * settings.jpyKrw;
      const totalUsd = totalKrw / settings.usdKrw;
      const marginUsd = settings.limitUsd - totalUsd;
      const marginJpy = settings.limitJpy - totalJpy;
      const rows = aggregateGroup(group).map((item) => `
        <tr>
          <td>${escapeHtml(item.code)}</td>
          <td>${escapeHtml(item.name)}</td>
          <td class="num">${formatter.format(item.quantity)}</td>
          <td class="num">${formatter.format(item.unitJpy)}</td>
          <td class="num">${formatter.format(item.subtotalJpy)}</td>
        </tr>
      `).join("");

      return `
        <article class="group-card">
          <div class="group-head">
            <div><b>주문 ${index + 1}</b> <span class="badge">약 ${money(totalUsd, 2)} USD</span></div>
            <div class="${marginUsd >= 0 ? "ok" : "bad"}">여유 약 ${money(marginUsd, 2)} USD / ${money(Math.floor(marginJpy))} JPY</div>
          </div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>상품번호</th>
                  <th>상품명</th>
                  <th class="num">수량</th>
                  <th class="num">단가(JPY)</th>
                  <th class="num">소계(JPY)</th>
                </tr>
              </thead>
              <tbody>
                ${rows}
                <tr>
                  <td colspan="4"><b>합계 / 약 ${money(totalKrw)}원</b></td>
                  <td class="num"><b>${money(totalJpy)}</b></td>
                </tr>
              </tbody>
            </table>
          </div>
        </article>
      `;
    }).join("");

    return `<section class="group-grid"><h2>추천 주문 그룹</h2>${cards}</section>`;
  }

  function getSettings() {
    const limitUsd = toNumber($("#limitUsd").value);
    const usdKrw = toNumber($("#usdKrw").value);
    const jpyKrw = toNumber($("#jpyKrw").value);
    const maxGroups = Math.max(1, Math.round(toNumber($("#maxGroups").value)));

    return {
      limitUsd,
      usdKrw,
      jpyKrw,
      maxGroups,
      splitQuantity: $("#splitQuantity").checked,
      limitJpy: (limitUsd * usdKrw) / jpyKrw,
    };
  }

  function getInputMode() {
    return document.querySelector("input[name='inputMode']:checked")?.value || "html";
  }

  function setInputMode(mode) {
    $("#htmlInputPanel").hidden = mode !== "html";
    $("#manualInputPanel").hidden = mode !== "manual";
    clearError();
    resetExportData();
  }

  function showError(message) {
    const errorBox = $("#errorBox");
    errorBox.textContent = message;
    errorBox.style.display = "block";
  }

  function clearError() {
    const errorBox = $("#errorBox");
    errorBox.textContent = "";
    errorBox.style.display = "none";
  }

  function updateManualRemoveButtons() {
    const buttons = [...document.querySelectorAll(".manual-remove")];
    buttons.forEach((button) => {
      button.disabled = buttons.length <= 1;
    });
  }

  function addManualRow(values = {}) {
    const row = document.createElement("tr");
    row.innerHTML = `
      <td><input class="manual-code" type="text" aria-label="상품번호" placeholder="13225MY9003"></td>
      <td><input class="manual-name" type="text" aria-label="상품명" placeholder="HONDA OEM Ring Set"></td>
      <td><input class="manual-quantity" type="text" inputmode="numeric" value="1" aria-label="수량"></td>
      <td><input class="manual-unit-jpy" type="text" inputmode="numeric" aria-label="단가 JPY" placeholder="5599"></td>
      <td><button type="button" class="danger compact manual-remove">삭제</button></td>
    `;
    $("#manualRows").appendChild(row);
    row.querySelector(".manual-code").value = values.code || "";
    row.querySelector(".manual-name").value = values.name || "";
    row.querySelector(".manual-quantity").value = values.quantity || 1;
    row.querySelector(".manual-unit-jpy").value = values.unitJpy || "";
    updateManualRemoveButtons();
  }

  function clearManualRows() {
    $("#manualRows").innerHTML = "";
    addManualRow();
  }

  function fillManualRows(products) {
    const rows = manualRowsFromProducts(products);
    $("#manualRows").innerHTML = "";
    rows.forEach((row) => addManualRow(row));
    if (!rows.length) addManualRow();
  }

  function copyLatestProductsToManual() {
    if (!latestAnalysis?.products?.length) {
      showError("직접 입력으로 가져올 상품이 없습니다.");
      return;
    }
    fillManualRows(latestAnalysis.products);
    document.querySelector("input[name='inputMode'][value='manual']").checked = true;
    setInputMode("manual");
    $("#manualInputPanel").scrollIntoView({ behavior: "smooth", block: "start" });
  }

  function analyze() {
    clearError();
    resetExportData();
    const settings = getSettings();
    const inputMode = getInputMode();
    let products = [];

    if (!settings.limitUsd || !settings.usdKrw || !settings.jpyKrw) {
      showError("면세 기준과 환율 값을 확인해 주세요.");
      return;
    }

    if (inputMode === "html") {
      const html = $("#cartHtml").value.trim();
      if (!html) {
        showError("분석할 HTML을 붙여넣어 주세요.");
        return;
      }
      products = parseProducts(html);
      if (!products.length) {
        showError("상품 행을 찾지 못했습니다. table-cart 영역의 HTML을 붙여넣었는지 확인해 주세요.");
        return;
      }
    } else {
      const manualResult = readManualProducts();
      if (manualResult.errors.length) {
        showError(manualResult.errors[0]);
        return;
      }
      products = manualResult.products;
      if (!products.length) {
        showError("직접 입력할 상품을 1개 이상 입력해 주세요.");
        return;
      }
    }

    const recommendation = recommendGroups(products, settings);
    latestAnalysis = { products, recommendation, settings };
    setExportEnabled(true);
    $("#resultArea").innerHTML = [
      renderSummary(products, recommendation, settings),
      renderGroups(recommendation, settings),
      renderProducts(products),
    ].join("");
  }

  clearManualRows();
  setInputMode(getInputMode());

  $("#analyzeButton").addEventListener("click", analyze);
  $("#exportXlsxButton").addEventListener("click", downloadXlsx);
  $("#resultArea").addEventListener("click", (event) => {
    if (event.target.dataset.action !== "copy-products-to-manual") return;
    copyLatestProductsToManual();
  });
  $("#addManualRowButton").addEventListener("click", () => {
    addManualRow();
    resetExportData();
  });
  $("#manualRows").addEventListener("click", (event) => {
    if (!event.target.classList.contains("manual-remove")) return;
    const rows = [...document.querySelectorAll("#manualRows tr")];
    if (rows.length <= 1) return;
    event.target.closest("tr").remove();
    updateManualRemoveButtons();
    resetExportData();
  });
  $("#clearButton").addEventListener("click", () => {
    $("#cartHtml").value = "";
    clearManualRows();
    clearError();
    resetExportData();
    $("#resultArea").innerHTML = '<div class="empty">분석 결과가 여기에 표시됩니다.</div>';
  });
  document.querySelectorAll("input[name='inputMode']").forEach((input) => {
    input.addEventListener("change", () => setInputMode(getInputMode()));
  });
  $("#manualRows").addEventListener("input", resetExportData);
  $("#manualRows").addEventListener("change", resetExportData);
  ["cartHtml", "limitUsd", "usdKrw", "jpyKrw", "maxGroups", "splitQuantity"].forEach((id) => {
    $(`#${id}`).addEventListener("input", resetExportData);
    $(`#${id}`).addEventListener("change", resetExportData);
  });
</script>
</body>
</html>
